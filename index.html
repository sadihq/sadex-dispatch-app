<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SADEX Dispatch Console</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .glass-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20 selection:bg-amber-500 selection:text-black">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3.5 flex items-center justify-between shadow-lg">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-500 font-black text-sm">
        S
      </div>
      <div>
        <h1 class="font-bold text-sm tracking-tight text-white flex items-center gap-1.5">
          SADEX <span class="text-amber-500 font-semibold">EXPRESS</span>
        </h1>
        <p class="text-[10px] text-slate-400 font-medium tracking-wide">Abuja Dispatch Console</p>
      </div>
    </div>
    <button onclick="fetchOrders()" class="text-xs bg-slate-800/80 hover:bg-slate-700 active:scale-95 text-slate-200 px-3 py-1.5 rounded-xl font-semibold border border-slate-700 transition flex items-center gap-1.5">
      <i class="fa-solid fa-arrows-rotate text-[10px]" id="refreshIcon"></i> Sync
    </button>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-5">

    <!-- Operational Metrics -->
    <div class="grid grid-cols-3 gap-2">
      <div class="glass-card rounded-2xl p-3 text-center border-l-2 border-l-amber-500">
        <p class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Pending</p>
        <h3 id="statPending" class="text-xl font-bold text-amber-400 mt-0.5">0</h3>
      </div>
      <div class="glass-card rounded-2xl p-3 text-center border-l-2 border-l-sky-500">
        <p class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Transit</p>
        <h3 id="statTransit" class="text-xl font-bold text-sky-400 mt-0.5">0</h3>
      </div>
      <div class="glass-card rounded-2xl p-3 text-center border-l-2 border-l-emerald-500">
        <p class="text-[10px] text-slate-400 font-medium uppercase tracking-wider">Delivered</p>
        <h3 id="statDelivered" class="text-xl font-bold text-emerald-400 mt-0.5">0</h3>
      </div>
    </div>

    <!-- Intake Logger Accordion Card -->
    <details class="group glass-card rounded-2xl border border-slate-800 transition">
      <summary class="list-none p-4 flex items-center justify-between cursor-pointer select-none">
        <div class="flex items-center space-x-2.5">
          <span class="w-6 h-6 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center text-xs">
            <i class="fa-solid fa-plus"></i>
          </span>
          <span class="text-xs font-bold uppercase tracking-wider text-slate-200">Log New Package</span>
        </div>
        <i class="fa-solid fa-chevron-down text-xs text-slate-400 transition-transform group-open:rotate-180"></i>
      </summary>
      
      <form id="orderForm" onsubmit="handleCreateOrder(event)" class="p-4 pt-0 space-y-3">
        <div>
          <label class="text-[11px] text-slate-400 font-semibold tracking-wide">Merchant / Sender</label>
          <input id="merchantName" required placeholder="e.g. Apex Attire" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-amber-500 text-white placeholder:text-slate-600 transition" />
        </div>
        
        <div>
          <label class="text-[11px] text-slate-400 font-semibold tracking-wide">Delivery Address</label>
          <input id="deliveryAddress" required placeholder="e.g. 14 Aguiyi Ironsi St, Maitama" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-amber-500 text-white placeholder:text-slate-600 transition" />
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[11px] text-slate-400 font-semibold tracking-wide">Customer Phone</label>
            <input id="customerPhone" required placeholder="08012345678" type="tel" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-amber-500 text-white placeholder:text-slate-600 transition" />
          </div>
          <div>
            <label class="text-[11px] text-slate-400 font-semibold tracking-wide">Category</label>
            <select id="itemCategory" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-amber-500 text-white transition">
              <option value="Standard">Standard Box</option>
              <option value="Fragile">Fragile / Sensitive</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-[11px] text-slate-400 font-semibold tracking-wide">Photo Proof URL (Optional)</label>
          <input id="proofUrl" placeholder="https://..." class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-amber-500 text-white placeholder:text-slate-600 transition" />
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-amber-500 hover:bg-amber-400 active:scale-[0.98] text-slate-950 font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-amber-500/20">
          Save Package to Fleet
        </button>
      </form>
    </details>

    <!-- Tab View Switcher -->
    <div class="flex bg-slate-900/80 p-1 rounded-xl border border-slate-800">
      <button onclick="switchTab('active')" id="tabActive" class="flex-1 py-1.5 rounded-lg text-xs font-bold transition bg-amber-500 text-slate-950">
        Active Route
      </button>
      <button onclick="switchTab('completed')" id="tabCompleted" class="flex-1 py-1.5 rounded-lg text-xs font-bold transition text-slate-400 hover:text-slate-200">
        Completed
      </button>
    </div>

    <!-- Active Orders / Dispatch Sequence -->
    <section class="space-y-3">
      <div id="ordersContainer" class="space-y-3">
        <div class="text-center py-10 text-slate-500 text-xs flex flex-col items-center gap-2">
          <i class="fa-solid fa-circle-notch fa-spin text-amber-500 text-base"></i>
          <span>Syncing live orders...</span>
        </div>
      </div>
    </section>

  </main>

  <script>
    const DATABASE_ID = "3c1c21a6f4768049a840d9ed8972b630";
    let currentTab = "active";
    let globalOrders = [];

    const ZONE_PRIORITIES = {
      "maitama": 1,
      "wuse 2": 2,
      "wuse": 3,
      "central area": 4,
      "area 11": 5,
      "garki": 6,
      "utako": 7,
      "jabi": 8
    };

    function cleanPhone(raw) {
      let d = (raw || "").toString().replace(/\D/g, "");
      if (d.startsWith("0") && d.length === 11) return "234" + d.slice(1);
      if (d.length === 10) return "234" + d;
      return d || "2347045750528";
    }

    function getZone(address) {
      const lower = (address || "").toLowerCase();
      for (const [zone, rank] of Object.entries(ZONE_PRIORITIES)) {
        if (lower.includes(zone)) return { name: zone.toUpperCase(), rank };
      }
      return { name: "CENTRAL", rank: 99 };
    }

    function switchTab(tab) {
      currentTab = tab;
      const tabActive = document.getElementById("tabActive");
      const tabCompleted = document.getElementById("tabCompleted");

      if (tab === "active") {
        tabActive.className = "flex-1 py-1.5 rounded-lg text-xs font-bold transition bg-amber-500 text-slate-950";
        tabCompleted.className = "flex-1 py-1.5 rounded-lg text-xs font-bold transition text-slate-400 hover:text-slate-200";
      } else {
        tabCompleted.className = "flex-1 py-1.5 rounded-lg text-xs font-bold transition bg-amber-500 text-slate-950";
        tabActive.className = "flex-1 py-1.5 rounded-lg text-xs font-bold transition text-slate-400 hover:text-slate-200";
      }
      renderOrders();
    }

    async function fetchOrders() {
      const icon = document.getElementById("refreshIcon");
      if (icon) icon.classList.add("fa-spin");

      try {
        const res = await fetch(`/api/notion?path=v1/databases/${DATABASE_ID}/query`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({})
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || `Status ${res.status}`);

        globalOrders = (data.results || []).map(page => {
          const props = page.properties;
          const merchant = props["Merchant Name"]?.title?.[0]?.plain_text || "Merchant";
          const address = props["Delivery Address"]?.rich_text?.[0]?.plain_text || "Abuja";
          const category = props["Item Category"]?.select?.name || "Standard";
          const status = props["Status"]?.status?.name || "Pending";
          const proofUrl = props["Photo Proof of Delivery URL"]?.url || "";
          
          let phone = "";
          if (props["Customer Phone"]?.type === "phone_number") {
            phone = props["Customer Phone"]?.phone_number || "";
          } else if (props["Customer Phone"]?.type === "rich_text") {
            phone = props["Customer Phone"]?.rich_text?.[0]?.plain_text || "";
          }

          const zoneInfo = getZone(address);

          return {
            id: page.id,
            merchant,
            address,
            phone: cleanPhone(phone),
            category,
            status,
            proofUrl,
            zone: zoneInfo.name,
            rank: zoneInfo.rank
          };
        });

        globalOrders.sort((a, b) => a.rank - b.rank);
        updateStats();
        renderOrders();
      } catch (err) {
        document.getElementById("ordersContainer").innerHTML = `<div class="text-center py-6 text-red-400 text-xs font-semibold">Failed to load: ${err.message}</div>`;
      } finally {
        if (icon) icon.classList.remove("fa-spin");
      }
    }

    function updateStats() {
      const pending = globalOrders.filter(o => o.status === "Pending").length;
      const transit = globalOrders.filter(o => o.status === "In-Transit").length;
      const delivered = globalOrders.filter(o => o.status === "Delivered").length;

      document.getElementById("statPending").innerText = pending;
      document.getElementById("statTransit").innerText = transit;
      document.getElementById("statDelivered").innerText = delivered;
    }

    async function setStatus(pageId, newStatus) {
      try {
        const payload = {
          properties: {
            "Status": { status: { name: newStatus } }
          }
        };

        const res = await fetch(`/api/notion?path=v1/pages/${pageId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error("Could not update status");
        await fetchOrders();
      } catch (e) {
        alert("Status update failed: " + e.message);
      }
    }

    function renderOrders() {
      const container = document.getElementById("ordersContainer");
      const filtered = globalOrders.filter(o => currentTab === "active" ? o.status !== "Delivered" : o.status === "Delivered");

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="glass-card rounded-2xl py-12 text-center text-slate-500 text-xs">
            <i class="fa-solid fa-box-open text-2xl mb-2 text-slate-600 block"></i>
            No ${currentTab} orders found.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map((order, idx) => {
        const inTransitText = encodeURIComponent(
          `🚚 *SADEX Express Dispatch Alert*\n\n` +
          `Hello, your package from *SADEX Express* is now *In-Transit* to: ${order.address}.\n` +
          `📦 Category: ${order.category}\n` +
          `Our dispatch rider is on the way.`
        );
        const inTransitLink = `https://wa.me/${order.phone}?text=${inTransitText}`;

        const proofSection = order.proofUrl ? `\n\n📷 Photo Proof: ${order.proofUrl}` : "";
        const deliveredText = encodeURIComponent(
          `🎉 *SADEX Express Delivery Completed*\n\n` +
          `Hello, your package from *SADEX Express* has been safely *Delivered* to: ${order.address}!${proofSection}\n\n` +
          `⭐ How was your delivery experience today? Reply 1-5 to rate our service.`
        );
        const deliveredLink = `https://wa.me/${order.phone}?text=${deliveredText}`;
        const mapsLink = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(order.address + ', Abuja')}`;

        return `
          <div class="glass-card rounded-2xl p-4 space-y-3 transition hover:border-slate-700">
            <div class="flex items-start justify-between">
              <div>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-amber-500/10 text-amber-400 border border-amber-500/20 tracking-wider">
                  #${idx + 1} ${order.zone}
                </span>
                <h3 class="font-bold text-white text-sm mt-1.5">${order.merchant}</h3>
                <a href="${mapsLink}" target="_blank" class="text-xs text-slate-400 hover:text-amber-400 flex items-center gap-1.5 mt-0.5 transition">
                  <i class="fa-solid fa-location-dot text-[10px] text-amber-500"></i> ${order.address}
                </a>
              </div>
              <div class="flex flex-col items-end gap-1.5">
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${order.status === 'Delivered' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : (order.status === 'In-Transit' ? 'bg-sky-500/10 text-sky-400 border border-sky-500/20' : 'bg-amber-500/10 text-amber-300 border border-amber-500/20')}">
                  ${order.status}
                </span>
                <a href="tel:${order.phone}" class="text-[11px] text-slate-400 hover:text-slate-200 flex items-center gap-1">
                  <i class="fa-solid fa-phone text-[9px]"></i> +${order.phone}
                </a>
              </div>
            </div>

            <!-- In-App Status Quick Toggle -->
            <div class="flex items-center gap-1.5 pt-1">
              <button onclick="setStatus('${order.id}', 'In-Transit')" class="flex-1 text-[10px] font-semibold py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-sky-300 border border-slate-700 transition">
                Set Transit
              </button>
              <button onclick="setStatus('${order.id}', 'Delivered')" class="flex-1 text-[10px] font-semibold py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-emerald-300 border border-slate-700 transition">
                Set Delivered
              </button>
            </div>

            <!-- WhatsApp Actions -->
            <div class="pt-2 border-t border-slate-800/80 grid grid-cols-2 gap-2">
              <a href="${inTransitLink}" target="_blank" class="text-center text-xs bg-slate-800/90 hover:bg-slate-700 active:scale-95 text-slate-200 py-2 rounded-xl font-medium transition flex items-center justify-center gap-1.5">
                <i class="fa-brands fa-whatsapp text-sky-400"></i> Dispatch Alert
              </a>
              <a href="${deliveredLink}" target="_blank" class="text-center text-xs bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white py-2 rounded-xl font-bold transition flex items-center justify-center gap-1.5 shadow-lg shadow-emerald-950/40">
                <i class="fa-brands fa-whatsapp"></i> Send POD Proof
              </a>
            </div>
          </div>
        `;
      }).join("");
    }

    async function handleCreateOrder(e) {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.innerText = "Saving to Fleet...";
      btn.disabled = true;

      const phoneVal = document.getElementById("customerPhone").value.trim();
      const merchantVal = document.getElementById("merchantName").value.trim();
      const addressVal = document.getElementById("deliveryAddress").value.trim();
      const catVal = document.getElementById("itemCategory").value;
      const proofVal = document.getElementById("proofUrl").value.trim();

      const payload = {
        parent: { database_id: DATABASE_ID },
        properties: {
          "Merchant Name": { title: [{ text: { content: merchantVal } }] },
          "Delivery Address": { rich_text: [{ text: { content: addressVal } }] },
          "Customer Phone": { phone_number: phoneVal },
          "Item Category": { select: { name: catVal } },
          "Status": { status: { name: "Pending" } }
        }
      };

      if (proofVal) {
        let validProof = proofVal.startsWith("http") ? proofVal : "https://" + proofVal;
        payload.properties["Photo Proof of Delivery URL"] = { url: validProof };
      }

      try {
        const res = await fetch(`/api/notion?path=v1/pages`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const responseData = await res.json();
        if (!res.ok) throw new Error(responseData.message || `Error ${res.status}`);

        document.getElementById("orderForm").reset();
        await fetchOrders();
      } catch (err) {
        alert("Notion Error: " + err.message);
      } finally {
        btn.innerText = "Save Package to Fleet";
        btn.disabled = false;
      }
    }

    fetchOrders();
  </script>
</body>
</html>
